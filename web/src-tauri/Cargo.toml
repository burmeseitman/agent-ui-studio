[package]
name = "agentui-studio"
version = "0.1.0"
description = "AgentUI Studio - Developer Workspace for Local AI Engines"
authors = ["AgentUI Studio contributors"]
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-shell = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rand = "0.8"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true
