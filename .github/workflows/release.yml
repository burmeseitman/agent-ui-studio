name: Release desktop app

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to build and publish (e.g. v0.1.0)'
        required: true

# Creating the release and uploading installers needs write access to contents.
permissions:
  contents: write

jobs:
  build:
    name: ${{ matrix.label }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: macOS (Apple Silicon)
            os: macos-latest
            target: aarch64-apple-darwin
          - label: macOS (Intel)
            os: macos-latest
            target: x86_64-apple-darwin
          - label: Linux (x86_64)
            os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
          - label: Windows (x86_64)
            os: windows-latest
            target: x86_64-pc-windows-msvc
            args: --target x86_64-pc-windows-msvc --bundles nsis

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: web/package-lock.json

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: web/src-tauri -> target
          prefix-key: "v1-${{ matrix.target }}"

      # Tauri's Linux bundler needs the system webview and packaging tools.
      - name: Install Linux dependencies
        if: startsWith(matrix.os, 'ubuntu')
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf \
            build-essential \
            curl \
            wget \
            file \
            libssl-dev \
            libgtk-3-dev \
            libxdo-dev || sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            build-essential \
            file \
            libssl-dev \
            libgtk-3-dev

      - name: Install frontend dependencies
        run: npm ci
        working-directory: web

      # The daemon ships inside the app, cross-compiled for the same triple.
      - name: Build daemon sidecar
        shell: bash
        env:
          TAURI_TARGET_TRIPLE: ${{ matrix.target }}
        run: ./scripts/build-sidecar.sh

      # Guards against shipping a build whose own tests do not pass.
      - name: Verify
        shell: bash
        run: |
          go test ./adapter/... ./api/... ./engine/... ./tools/...
          cd web && npm test

      - name: Build and publish
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Without an identity Tauri leaves the .app bundle unsealed: the Rust
          # linker ad-hoc signs the binary, so the signature claims sealed
          # resources that were never written, and macOS refuses to launch it
          # as damaged. Neither right-click → Open nor clearing the quarantine
          # attribute repairs that, because the signature itself is invalid.
          # "-" is the ad-hoc pseudo-identity, which seals the bundle and
          # costs nothing; a real Developer ID takes over when the secret is
          # present. Signing must happen during the build — a codesign step
          # afterwards would come too late, as the .dmg is already packaged.
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY || '-' }}
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        with:
          projectPath: web
          tagName: ${{ github.event.inputs.tag || github.ref_name }}
          releaseName: 'AgentUI Studio __VERSION__'
          releaseBody: |
            Local-first workspace for Ollama, LM Studio and other local AI engines.

            **Downloads**
            - macOS Apple Silicon: `.dmg` with `aarch64` in the name
            - macOS Intel: `.dmg` with `x64` in the name
            - Windows: NSIS `.exe` installer
            - Linux: `.AppImage` (portable), `.deb` or `.rpm`

            The Go daemon is bundled inside the app — there is nothing else to install.

            > These builds are **not code signed**. macOS will say the app "cannot be opened
            > because the developer cannot be verified": right-click the app and choose *Open*,
            > or run `xattr -dr com.apple.quarantine "/Applications/AgentUI Studio.app"`.
            > Windows SmartScreen will warn similarly — choose *More info → Run anyway*.
          releaseDraft: false
          prerelease: false
          args: ${{ matrix.args || format('--target {0}', matrix.target) }}

      # A signature that does not verify is the one defect that makes the app
      # unlaunchable while every other check passes, so fail the job loudly
      # rather than leaving it to be discovered after download. This runs after
      # the upload — tauri-action builds and publishes in one step — so it
      # marks a bad release as failed instead of preventing it.
      - name: Verify macOS signature
        if: startsWith(matrix.os, 'macos')
        shell: bash
        run: |
          app=$(find "web/src-tauri/target/${{ matrix.target }}/release/bundle/macos" \
            -maxdepth 1 -name '*.app' -print -quit)
          if [ -z "$app" ]; then
            echo "no .app bundle found to verify"; exit 1
          fi
          codesign --verify --deep --strict --verbose=2 "$app"
          echo "signature verified: $app"
