name: Desktop build

on:
  push:
    tags: ['v*']
  workflow_dispatch:

jobs:
  bundle:
    name: ${{ matrix.label }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: macOS (Apple Silicon)
            os: macos-latest
            target: aarch64-apple-darwin
          - label: macOS (Intel)
            os: macos-latest
            target: x86_64-apple-darwin
          - label: Linux (x86_64)
            os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
          - label: Windows (x86_64)
            os: windows-latest
            target: x86_64-pc-windows-msvc

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: web/package-lock.json

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: web/src-tauri -> target

      # Tauri's Linux bundler needs the system webview and packaging tools.
      - name: Install Linux dependencies
        if: matrix.os == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            build-essential \
            file \
            libssl-dev \
            libgtk-3-dev

      - name: Install frontend dependencies
        run: npm ci
        working-directory: web

      # Cross-compiles the Go daemon for the same triple Tauri is bundling for.
      - name: Build daemon sidecar
        shell: bash
        env:
          TAURI_TARGET_TRIPLE: ${{ matrix.target }}
        run: ./scripts/build-sidecar.sh

      - name: Build desktop bundle
        run: npm run tauri build -- --target ${{ matrix.target }}
        working-directory: web

      - uses: actions/upload-artifact@v4
        with:
          name: agentui-studio-${{ matrix.target }}
          if-no-files-found: error
          path: |
            web/src-tauri/target/${{ matrix.target }}/release/bundle/dmg/*.dmg
            web/src-tauri/target/${{ matrix.target }}/release/bundle/macos/*.app
            web/src-tauri/target/${{ matrix.target }}/release/bundle/deb/*.deb
            web/src-tauri/target/${{ matrix.target }}/release/bundle/appimage/*.AppImage
            web/src-tauri/target/${{ matrix.target }}/release/bundle/msi/*.msi
            web/src-tauri/target/${{ matrix.target }}/release/bundle/nsis/*.exe
